<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Static Bloom poster artwork">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="55%" stop-color="#171717" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="26%" r="55%">
      <stop offset="0%" stop-color="#f99c00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f99c00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="scrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.88" />
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" />
    </pattern>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bg)" />
  <rect width="600" height="900" fill="url(#dots)" opacity="0.05" />
  <circle cx="300" cy="240" r="330" fill="url(#glow)" />

  <line x1="-60" y1="170" x2="660" y2="30" stroke="#f99c00" stroke-opacity="0.12" stroke-width="2" />
  <line x1="-60" y1="230" x2="660" y2="90" stroke="#f99c00" stroke-opacity="0.07" stroke-width="1" />

  <circle cx="300" cy="420" r="58" fill="#000000" fill-opacity="0.3" stroke="#f99c00" stroke-opacity="0.45" stroke-width="2" />
  <path d="M286,396 L286,444 L326,420 Z" fill="#f99c00" fill-opacity="0.65" />

  <rect x="0" y="600" width="600" height="300" fill="url(#scrim)" />

  <rect x="32" y="716" rx="13" ry="13" width="77" height="26" fill="#f99c00" fill-opacity="0.16" stroke="#f99c00" stroke-opacity="0.4" />
  <text x="70.5" y="734" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f99c00">SCI-FI</text>

  <text x="32" y="780" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#ffffff" filter="url(#textShadow)">Static Bloom</text>

  <g opacity="0.55">
    <rect x="20" y="20" rx="10" ry="10" width="96" height="24" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="68" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff">DEMO ART</text>
  </g>
</svg>
